name: ethos-chat
version: '${version}'
main: ru.nyansus.mc.ethos_chat.EthosChat
api-version: '1.21'
author: Nyansus
softdepend:
  - PlaceholderAPI

commands:
  chatcolor:
    description: Set a player's chat name color
    usage: /<command> <player> <#RRGGBB|reset>
    permission: ethos.chat.color
  rpname:
    description: Set a player's RP display name
    usage: /<command> <player> <name|reset>
    permission: ethos.chat.rpname
  rprace:
    description: Set a player's RP race
    usage: /<command> <player> <race|reset>
    permission: ethos.chat.rpname
  nametagheight:
    description: Set a player's nametag height offset
    usage: /<command> <player> <offset|reset>
    permission: ethos.chat.rpname
  realname:
    description: Look up a player's real name by their RP name
    usage: /<command> <rp-name>
  afk:
    description: Toggle your AFK status
    usage: /<command>
    permission: ethos.chat.afk
  rp:
    description: Toggle your active RP status
    usage: /<command>
    permission: ethos.chat.rp
  ethoschat:
    description: Plugin admin commands
    usage: /<command> reload
    permission: ethos.chat.admin
    aliases: [domyachat]

permissions:
  ethos.chat.color:
    description: Allows setting player chat colors
    default: op
  ethos.chat.rpname:
    description: Allows setting player RP names
    default: op
  ethos.chat.admin:
    description: Allows using /ethoschat admin commands
    default: op
  ethos.chat.afk:
    description: Allows toggling personal AFK status
    default: true
  ethos.chat.rp:
    description: Allows toggling personal RP status
    default: true
