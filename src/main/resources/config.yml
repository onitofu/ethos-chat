# Chat format. Placeholders: <player>, <message>, <title>
# Gradient and hover are applied automatically to <player>.
# <title> is resolved from Ethos via PlaceholderAPI (empty if no title or plugin missing).
# Uses MiniMessage syntax: https://docs.advntr.dev/minimessage/format.html
format: "<dark_gray>▶ <title><player> <dark_gray>» <gray><message>"

# Who can use /chatcolor command: "op" (operators only) or "all" (everyone)
chatcolor-access: op

# Who can use /rpname and /rprace commands: "op" (operators only) or "all" (everyone)
rpname-access: op

# PlaceholderAPI placeholders for title/karma integration.
# Change these if your titles plugin uses different placeholder names.
placeholders:
  title: "%ethos_title_colored%"
  karma: "%ethos_karma%"
  # Wrapper applied around the resolved title (MiniMessage). The <title> token
  # is replaced with the title value. Used only when title is non-empty — for
  # players without a title nothing is rendered. Set to "<title>" to disable brackets.
  title-wrap: "<dark_gray>[</dark_gray><title><dark_gray>]</dark_gray>"

# Tab list layout. Legacy tab-colors and tab-update-interval keys are still
# accepted when upgrading an existing installation.
tab:
  enabled: true
  # Update interval in ticks (20 ticks = 1 second).
  update-interval: 200
  # Titles remain available in chat even when hidden here.
  show-title: false
  show-karma: true
  show-ping: true
  show-rp-status: true
  # Keep players with active RP status above inactive players.
  sort-rp-first: true
  # Pixel gap between columns. Values below 12 are clamped to 12.
  column-gap: 12

# AFK settings. Set to 0 to disable automatic AFK while keeping /afk enabled.
afk:
  auto-after-seconds: 300

# Hue shift (in degrees, 0-360) for the gradient second color.
# Set to 0 to disable gradient (single solid color).
gradient-shift: 25

# Ping color thresholds (ms) for the hover tooltip.
# Below good-ping: green, below bad-ping: yellow, above: red.
ping-thresholds:
  good: 50
  bad: 150

# Nametag settings for RP name/race displays above player heads.
nametag:
  # Height offset for the RP name display
  name-offset: 0.4
  # Height offset for the race display
  race-offset: 0.2
  # Race display scale (0.0-1.0)
  race-scale: 0.6
  # Race format. Placeholder: {race}
  race-format: "\u00AB{race}\u00BB"

# Local/global chat. Set to false for vanilla-style chat (everyone sees everything).
local-chat:
  enabled: true
  radius: 128
  global-prefix: "!"
  # Format for local/global prefixes. Placeholder: <prefix>
  # The prefix letter (Л/G) is provided by the messages file.
  local-format: "<dark_gray>[<gray><prefix><dark_gray>] "
  global-format: "<dark_gray>[<yellow><prefix><dark_gray>] "

# Default color palette for players without a custom color.
# Colors are assigned based on UUID hash. Use color names or #RRGGBB.
default-colors:
  - dark_green
  - dark_aqua
  - dark_red
  - dark_purple
  - gold
  - blue
  - green
  - aqua
  - red
  - light_purple
  - yellow
